<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders - Emmanuel Store</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <style>
        :root {
            --primary: #2d3436;
            --accent: #0075eb;
            --success: #27ae60;
            --bg: #f8f9fa;
            --danger: #d63031;
        }

        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 20px; color: var(--primary); }
        .container { max-width: 800px; margin: 0 auto; }
        
        /* Navigation styling */
        .navigation-box { margin-bottom: 20px; }
        .back-btn { 
            text-decoration: none; 
            color: var(--primary); 
            font-weight: bold; 
            display: inline-flex; 
            align-items: center; 
            gap: 5px; 
            transition: 0.3s;
        }
        .back-btn:hover { color: var(--accent); transform: translateX(-5px); }

        .card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; }
        
        .item-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #eee; }
        .delete-btn { color: var(--danger); cursor: pointer; transition: 0.2s; }
        .delete-btn:hover { transform: scale(1.2); color: #ff7675; }

        /* Tracking Timeline */
        .track-wrapper { margin-top: 30px; padding: 20px 0; }
        .track-bar { display: flex; justify-content: space-between; position: relative; }
        .track-bar::before { content: ''; position: absolute; top: 20px; left: 0; width: 100%; height: 4px; background: #dfe6e9; z-index: 1; }
        
        .step { position: relative; z-index: 2; text-align: center; width: 25%; }
        .step i { background: #dfe6e9; color: white; width: 40px; height: 40px; line-height: 40px; border-radius: 50%; display: inline-block; margin-bottom: 10px; transition: 0.4s; }
        
        .step.active i { background: var(--success); }
        .step.active p { color: var(--success); font-weight: bold; }
        
        /* Summary Text */
        .summary-line { display: flex; justify-content: flex-end; gap: 20px; margin-top: 10px; font-size: 0.9rem; color: #636e72; }
    </style>
</head>
<body>

<div class="container">
    <div class="navigation-box">
        <a href="index.html" class="back-btn">
            <i class="material-icons">arrow_back</i> Back to Shop
        </a>
    </div>

    <div class="card">
        <h2 style="display:flex; align-items:center; gap:10px; margin-top:0;">
            <i class="material-icons" style="color:var(--accent)">shopping_basket</i>
            Current Order Review
        </h2>
        <div id="reviewList"></div>
        
        <div id="priceSummary" style="margin-top:20px; border-top: 2px solid #eee; padding-top: 15px;">
            <div class="summary-line"><span>Subtotal:</span> <span id="subTotal">£0.00</span></div>
            <div class="summary-line"><span>Delivery Fee:</span> <span id="deliveryFee">£0.00</span></div>
            <div class="summary-line" style="font-size: 1.3rem; color: var(--primary); font-weight: bold;">
                <span>Grand Total:</span> <span id="reviewTotal">£0.00</span>
            </div>
        </div>
    </div>

    <div class="card">
        <h2 style="display:flex; align-items:center; gap:10px; margin-top:0;">
            <i class="material-icons" style="color:var(--success)">local_shipping</i>
            Live Tracking
        </h2>
        <p id="orderNumber" style="background: #f1f2f6; display: inline-block; padding: 5px 15px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; color: #57606f;"></p>
        
        <div class="track-wrapper">
            <div class="track-bar">
                <div class="step active">
                    <i class="material-icons">check_circle</i>
                    <p>Confirmed</p>
                </div>
                <div class="step active">
                    <i class="material-icons">inventory_2</i>
                    <p>Processing</p>
                </div>
                <div class="step" id="shipStep">
                    <i class="material-icons">local_shipping</i>
                    <p>On the Way</p>
                </div>
                <div class="step" id="deliverStep">
                    <i class="material-icons">home</i>
                    <p>Delivered</p>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Note: Make sure the key matches your main script! 
    // You used 'emmanuel_cart' in your first message, and 'emmanuel_store_cart' in this one.
    // I am setting it to 'emmanuel_cart' to match your main shop script.
    const CART_KEY = 'emmanuel_cart';
    let cart = JSON.parse(localStorage.getItem(CART_KEY)) || [];

    function renderReview() {
        const listDiv = document.getElementById('reviewList');
        const subDisp = document.getElementById('subTotal');
        const feeDisp = document.getElementById('deliveryFee');
        const totalDisp = document.getElementById('reviewTotal');
        
        if (cart.length === 0) {
            listDiv.innerHTML = `
                <div style='text-align:center; color:#636e72; padding: 20px;'>
                    <p style="font-size:3rem; margin:0;">🛒</p>
                    <p>No items in your current order.</p>
                </div>`;
            document.getElementById('priceSummary').style.display = 'none';
            return;
        }

        document.getElementById('priceSummary').style.display = 'block';
        let subtotal = 0;
        listDiv.innerHTML = "";

        cart.forEach((item, index) => {
            // Check if price is a number, if not, try to clean it
            let price = typeof item.price === 'number' ? item.price : parseFloat(item.price);
            subtotal += price * (item.quantity || 1);
            
            listDiv.innerHTML += `
                <div class="item-row">
                    <div>
                        <span style="display:block; font-weight:bold;">${item.name} ${item.quantity > 1 ? '(x'+item.quantity+')' : ''}</span>
                        <span style="color:var(--accent); font-size: 0.9rem;">£${price.toFixed(2)}</span>
                    </div>
                    <i class="material-icons delete-btn" title="Remove Item" onclick="deleteFromReview(${index})">delete_outline</i>
                </div>
            `;
        });

        // Your Delivery logic
        let shipping = (subtotal > 0 && subtotal < 50) ? 5.00 : 0.00;
        
        subDisp.innerText = `£${subtotal.toFixed(2)}`;
        feeDisp.innerText = shipping > 0 ? `£${shipping.toFixed(2)}` : "FREE";
        totalDisp.innerText = `£${(subtotal + shipping).toFixed(2)}`;
    }

    function deleteFromReview(index) {
        if(confirm("Remove this item from your order review?")) {
            cart.splice(index, 1);
            localStorage.setItem(CART_KEY, JSON.stringify(cart));
            renderReview();
        }
    }

    document.getElementById('orderNumber').innerText = "TRACKING ID: #EM-" + Math.floor(100000 + Math.random() * 900000);

    window.onload = () => {
        renderReview();
        
        setTimeout(() => {
            const ship = document.getElementById('shipStep');
            if(ship) ship.classList.add('active');
        }, 4000);
        
        setTimeout(() => {
            const deliver = document.getElementById('deliverStep');
            if(deliver) deliver.classList.add('active');
        }, 8000);
    };
</script>

</body>
</html>
